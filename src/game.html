<!doctype html>
<html lang="en" dir="ltr">
<head>
<!--SDK-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cloudsea Dragon</title>
<!--META-->
<!--FONTS-->
<style>
:root{--gold:#ffd166;--gold2:#ffb23f;--plum:#2a1640;--plum2:#3b2160;--ink:#1c0d27;--cream:#fff4e3;--red:#ff5a5f;--teal:#3fd6b8;--line:#140a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1030;touch-action:none;overscroll-behavior:none}
body{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;color:var(--cream);font-weight:600}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ui button{pointer-events:auto;font:inherit;cursor:pointer}
.hide{display:none!important}
.out{text-shadow:0 2px 0 var(--line),0 -2px 0 var(--line),2px 0 0 var(--line),-2px 0 0 var(--line),2px 2px 0 var(--line),-2px 2px 0 var(--line),2px -2px 0 var(--line),-2px -2px 0 var(--line)}
#logo .t1,#zoneTitle,.card h2{text-shadow:0 3px 0 var(--line),0 -3px 0 var(--line),3px 0 0 var(--line),-3px 0 0 var(--line),3px 3px 0 var(--line),-3px 3px 0 var(--line),3px -3px 0 var(--line),-3px -3px 0 var(--line),0 7px 0 rgba(20,10,31,.5)}
svg{display:block}
.ico{width:1.2em;height:1.2em;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
/* buttons */
.btn{border:3px solid var(--line);border-radius:18px;padding:8px 18px;font-weight:800;font-size:18px;color:var(--ink);background:linear-gradient(#fff0b3,#ffc34d 55%,#ff9f2e);box-shadow:0 5px 0 var(--line),0 9px 16px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 var(--line),0 3px 8px rgba(0,0,0,.3)}
.btn.teal{background:linear-gradient(#b9fff0,#4fe0c2 55%,#1fb597)}
.btn.pink{background:linear-gradient(#ffd3e6,#ff8fb8 55%,#f1588f)}
.btn.ghost{background:linear-gradient(#5a3d82,#3b2160);color:var(--cream)}
.btn[disabled]{filter:grayscale(.8) brightness(.8);pointer-events:none}
.round{width:44px;height:44px;padding:0;border-radius:14px;background:linear-gradient(#5d3f86,#3b2160);color:var(--cream)}
.round .ico{width:24px;height:24px}
/* top bar */
#topbar{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:8px;margin-top:env(safe-area-inset-top)}
#bLang{font-size:17px}
/* hud */
#hud{position:absolute;top:10px;inset-inline-start:12px;inset-inline-end:170px;margin-top:env(safe-area-inset-top);display:flex;flex-direction:column;gap:6px;max-width:460px}
#flame{position:relative;height:26px;border:3px solid var(--line);border-radius:14px;background:rgba(28,13,39,.7);overflow:hidden;box-shadow:0 4px 0 rgba(20,10,31,.5)}
#flameFill{position:absolute;inset-block:0;inset-inline-start:0;width:100%;background:linear-gradient(90deg,#ff5a3c,#ffb23f 60%,#ffe98a);border-radius:10px;transition:width .12s}
[dir=rtl] #flameFill{background:linear-gradient(270deg,#ff5a3c,#ffb23f 60%,#ffe98a)}
#flame.low #flameFill{animation:lowf .5s infinite alternate}
@keyframes lowf{to{filter:brightness(1.8) saturate(1.4)}}
#flameIco{position:absolute;inset-inline-start:6px;top:1px;width:20px;height:20px}
#fireBar{position:absolute;inset-inline-end:6px;top:5px;display:flex;gap:2px}
#fireBar i{width:6px;height:10px;border-radius:3px;background:rgba(255,255,255,.2)}
#fireBar i.on{background:#ff7b3a;box-shadow:0 0 6px #ff7b3a}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 10px;border-radius:12px;background:rgba(28,13,39,.62);border:2px solid rgba(20,10,31,.8);font-weight:800;font-size:17px}
.chip.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.25)}}
#hCombo{color:#ffe46b}
#hShield{color:#bff3ff}
/* screens */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 14px 18px}
#logo{text-align:center;line-height:.95;pointer-events:none}
#logo .t1{font-size:clamp(44px,12vw,86px);font-weight:800;color:#ffe08a;letter-spacing:.5px}
#logo .t2{font-size:clamp(17px,4.4vw,24px);margin-top:6px;color:var(--cream)}
#menuBottom{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:560px}
#bPlay{font-size:32px;padding:10px 54px;border-radius:24px}
#bPlay .ico{width:30px;height:30px}
#langPick{display:flex;gap:6px;background:rgba(28,13,39,.55);padding:4px;border-radius:16px;border:2px solid rgba(20,10,31,.8)}
#langPick button{border:0;background:none;color:var(--cream);padding:4px 14px;border-radius:12px;font-weight:800;font-size:16px}
#langPick button.on{background:var(--gold);color:var(--ink)}
.mrow{display:flex;gap:7px;justify-content:center;width:100%}
.mbtn{position:relative;flex:1 1 0;max-width:104px;min-width:0;flex-direction:column;gap:0;padding:6px 4px 4px;font-size:14px;border-radius:16px;white-space:nowrap}
.mbtn span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mbtn .ico{width:28px;height:28px}
.dot{position:absolute;top:-7px;inset-inline-end:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--red);border:2px solid var(--line);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#festBanner{font-weight:800;font-size:15px;padding:2px 12px;border-radius:12px;background:rgba(28,13,39,.6);border:2px solid rgba(20,10,31,.8)}
#festBanner.on{background:linear-gradient(90deg,#ff7b3a,#ffcd4d);color:var(--ink);border-color:var(--line)}
#menuTopInfo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
/* modal */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,4,20,.55);pointer-events:auto;padding:12px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.card{width:100%;max-width:520px;max-height:calc(100% - 20px);display:flex;flex-direction:column;background:linear-gradient(#43256b,#2a1640);border:3px solid var(--line);border-radius:24px;box-shadow:0 8px 0 var(--line),0 16px 40px rgba(0,0,0,.5);animation:cardin .28s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardin{from{transform:scale(.8) translateY(30px);opacity:0}}
.card h2{margin:0;font-size:26px;font-weight:800;color:#ffe08a}
.chead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;gap:10px}
.cbody{overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.cfoot{display:flex;gap:10px;justify-content:center;padding:0 14px 16px;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.07);border:2px solid rgba(20,10,31,.6)}
.item .ic{width:44px;height:44px;flex:none;border-radius:12px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.item .ic .ico{width:30px;height:30px}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:17px;line-height:1.15}
.item .ds{font-size:13.5px;opacity:.85;line-height:1.25}
.item .btn{font-size:15px;padding:5px 10px;border-radius:13px;min-width:86px}
.item.lock{opacity:.6}
.bar{height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fd6b8,#b9fff0);border-radius:6px}
[dir=rtl] .bar i{background:linear-gradient(270deg,#3fd6b8,#b9fff0)}
.pearlAmt{display:inline-flex;align-items:center;gap:4px}
.bigstat{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.07)}
.badge{align-self:center;background:linear-gradient(90deg,#ff7b3a,#ffcd4d);color:var(--ink);font-weight:800;padding:2px 16px;border-radius:12px;border:2px solid var(--line);animation:pop .5s}
.zsw{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);flex:none}
.item.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
#reviveCard .cbody{align-items:center;text-align:center}
#revTimer{font-size:54px;font-weight:800;color:#ffe08a}
/* ad */
#adov{position:absolute;inset:0;background:#0d0716;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;z-index:50}
#adov .lbl{font-size:15px;padding:2px 12px;border:2px solid #fff4;border-radius:10px;opacity:.8}
#adov .cnt{font-size:72px;font-weight:800;color:#ffe08a}
/* tutorial */
#tut{position:fixed;inset:0;pointer-events:none;z-index:30;font-family:inherit}
#tutArrow{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;filter:drop-shadow(0 4px 0 rgba(20,10,31,.6))}
#tutArrow svg{width:54px;height:54px;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}
#tutBubble{position:absolute;max-width:min(300px,80vw);background:var(--cream);color:var(--ink);font-weight:800;font-size:20px;padding:8px 16px;border-radius:18px;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);text-align:center;transform:translate(-50%,0);white-space:normal;line-height:1.2}
/* toasts & banners */
#toasts{position:absolute;top:92px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:env(safe-area-inset-top);z-index:20}
.toast{background:rgba(28,13,39,.85);border:3px solid var(--line);border-radius:16px;padding:4px 14px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;animation:tin .35s cubic-bezier(.2,1.6,.4,1)}
.toast.gold{background:linear-gradient(90deg,#ff7b3a,#ffcd4d);color:var(--ink)}
.toast.bye{transition:opacity .4s,transform .4s;opacity:0;transform:translateY(-12px)}
@keyframes tin{from{transform:scale(.6);opacity:0}}
#zoneTitle{position:absolute;top:30%;inset-inline:0;text-align:center;font-size:clamp(34px,8vw,60px);font-weight:800;color:#ffe08a;pointer-events:none;opacity:0}
#zoneTitle.show{animation:zt 2.6s ease-out}
#zoneTitle small{display:block;font-size:.4em;color:var(--cream)}
@keyframes zt{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#pauseScr .cbody{align-items:center}
@media (orientation:landscape) and (max-height:500px){
 #menu{padding-top:12px;padding-bottom:10px}
 #logo .t1{font-size:clamp(34px,8vh,60px)}
 #bPlay{font-size:26px;padding:6px 40px}
 .mbtn{font-size:13px}
 .mbtn .ico{width:24px;height:24px}
 #toasts{top:70px}
 .card{max-width:560px}
 .card h2{font-size:22px}
}
@media (min-width:1100px) and (min-height:720px){#ui{zoom:1.3}#tutBubble{font-size:24px}}
@media (max-width:380px){ .mbtn{font-size:12.5px} #hud{inset-inline-end:160px} }
</style>
</head>

 ctx.save();ctx.translate(6,8);ctx.rotate(jaw);ctx.fillStyle=D.body2;ctx.beginPath();ctx.ellipse(18,4,26,9,0,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle=D.belly;ctx.beginPath();ctx.ellipse(16,6,18,4,0,0,TAU);ctx.fill();ctx.restore();
 // head + snout
 ctx.fillStyle=D.body;
 ctx.beginPath();ctx.ellipse(0,0,30,24,0,0,TAU);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.ellipse(26,2,24,15,0.05,0,TAU);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.ellipse(8,0,26,20,0,0,TAU);ctx.fill();
 ctx.fillStyle=rgba('#ffffff',0.3);ctx.beginPath();ctx.ellipse(-2,-12,14,6,-0.2,0,TAU);ctx.fill();
 ctx.fillStyle=D.belly;ctx.beginPath();ctx.ellipse(22,10,18,6,0.1,0,TAU);ctx.fill();
 // nostril
 ctx.fillStyle='#2a0f1f';ctx.beginPath();ctx.ellipse(44,-4,3,2.2,0,0,TAU);ctx.fill();
 // cheek
 ctx.fillStyle=rgba('#ff8fa6',0.6);ctx.beginPath();ctx.ellipse(6,8,7,4,0,0,TAU);ctx.fill();
 // eye
 const blink=R.dying>0?1:(Math.sin(G.time*0.9)>0.985?1:0);
 ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(10,-8,10,blink?2:11,0,0,TAU);ctx.fill();ctx.stroke();
 if(!blink){ctx.fillStyle='#2a0f1f';ctx.beginPath();ctx.ellipse(13,-8,5,7,0,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(15,-11,2.2,0,TAU);ctx.fill()}
 // whiskers
 ctx.strokeStyle=D.mane;ctx.lineWidth=3.5;const ww=Math.sin(G.time*6)*10;
 ctx.beginPath();ctx.moveTo(42,4);ctx.bezierCurveTo(30,30,-10,26+ww,-40,40+ww);ctx.stroke();
 ctx.beginPath();ctx.moveTo(40,-6);ctx.bezierCurveTo(20,-30,-20,-20-ww,-50,-30-ww);ctx.stroke();
 ctx.restore();
 ctx.globalAlpha=1;
 // shield bubble
 if(!R.demo&&R.shield>0){ctx.strokeStyle=rgba('#bff3ff',0.45+0.2*Math.sin(G.time*4));ctx.lineWidth=5;ctx.beginPath();ctx.arc(R.x,R.y,54,0,TAU);ctx.stroke()}
 // embers
 if(Math.random()<0.4*dim)part(R.x-Math.cos(R.ang)*30,R.y-Math.sin(R.ang)*30,rnd(-40,40)-R.vx*0.1,rnd(-60,20),rnd(0.3,0.6),rnd(3,6),R.fireT>0?'#ff7b3a':'#ffb23f',1);
}

 ui.tutArrow.style.left=x+'px';ui.tutArrow.style.top=clamp(ay,30,H-30)+'px';ui.tutArrow.style.transform=below?'rotate(180deg)':'';
 const bw=ui.tutBubble.offsetWidth||200,bh=ui.tutBubble.offsetHeight||50;
 const bx=clamp(x,bw/2+10,W-bw/2-10);const by=below?clamp(ay+34,10,H-bh-10):clamp(ay-34-bh,70,H-bh-10);
 ui.tutBubble.style.left=bx+'px';ui.tutBubble.style.top=by+'px';
}
function tutStep(dt){
 R.tt+=dt;
 const head=()=>{const s=w2s(R.x,R.y-40);return {x:s.x,y:s.y,h:0}};
 if(R.tstep===0){G.ts=R.hold?1:0.35;if(!tutTarget||tutText!==t('hold'))tutShow(t('hold'),head);if(R.hold&&R.inCloud&&R.y-surf(R.x)>110){R.tstep=1;R.tt=0}}
 else if(R.tstep===1){const d=R.y-surf(R.x);G.ts=d>260&&R.hold?0.3:1;if(tutText!==t('release'))tutShow(t('release'),head);if(!R.hold&&!R.inCloud){R.tstep=2}}
 else if(R.tstep===2){G.ts=1;let tg=null;for(const o of items){if(o.type==='lan'&&!o.dead&&o.x>R.x){if(!tg||o.x<tg.x)tg=o}}
  if(tg){const tgt=tg;if(tutText!==t('eatL')||tutTarget.o!==tgt){const f=()=>{const s=w2s(tgt.x,tgt.y-40);return {x:s.x,y:s.y,h:0}};f.o=tgt;tutShow(t('eatL'),f)}}
  if(R.tEat>=3||R.tt>9){R.tstep=3;R.tt=0}}
 else if(R.tstep===3){if(tutText!==t('flameTip'))tutShow(t('flameTip'),()=>{const r=ui.flame.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top,h:r.height}});if(R.tt>3.5){R.tstep=-1;tutHide();G.ts=1}}
}

// ================= input =================
function holdOn(){A.init();if(G.mode==='run'&&!G.userPaused)G.hold=true}
function holdOff(){G.hold=false}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){ }holdOn()});
cv.addEventListener('pointerup',holdOff);cv.addEventListener('pointercancel',holdOff);cv.addEventListener('lostpointercapture',holdOff);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
 if(e.repeat&&(e.code==='Space'||e.code==='ArrowDown'))return;
 if(e.code==='Space'||e.code==='ArrowDown'||e.code==='KeyS'||e.code==='KeyW'||e.code==='ArrowUp'){e.preventDefault();if(G.mode==='menu'&&ui.sheet.classList.contains('hide')&&e.code==='Space'){startGame();return}holdOn()}
 else if(e.code==='Enter'&&G.mode==='menu'&&ui.sheet.classList.contains('hide'))startGame();
 else if(e.code==='Escape'||e.code==='KeyP'){if(!ui.sheet.classList.contains('hide'))closeSheet();else if(G.mode==='run')setUserPause(!G.userPaused)}
 else if(e.code==='KeyM')toggleMute();
});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowDown'||e.code==='KeyS'||e.code==='KeyW'||e.code==='ArrowUp')holdOff()});
window.addEventListener('blur',holdOff);
function toggleMute(){A.init();S.muted=!S.muted;ui.bSnd.innerHTML=S.muted?I.sndOff:I.sndOn;A.apply();markDirty()}
btnDown(ui.bSnd,toggleMute);
btnDown(ui.bLang,()=>{S.lang=LANG==='ar'?'en':'ar';applyLang(S.lang);markDirty()});
ui.langPick.querySelectorAll('button').forEach(b=>btnDown(b,()=>{S.lang=b.dataset.l;applyLang(S.lang);markDirty()}));
btnDown(ui.bPause,()=>setUserPause(true));
btnDown(ui.bPlay,startGame);
btnDown(ui.bUp,()=>{tutHide();openSheet('up')});
btnDown(ui.bMis,()=>openSheet('mis'));
btnDown(ui.bJour,()=>openSheet('jour'));
btnDown(ui.bReb,()=>openSheet('reb'));
btnDown(ui.bGift,()=>openSheet('gift'));

ui.sheet.addEventListener('click',e=>{if(e.target===ui.sheet)closeSheet()});
['pointerdown','pointerup'].forEach(ev=>ui.sheet.addEventListener(ev,e=>e.stopPropagation()));
// system pause (YouTube) & visibility
function sysPause(on){G.sysPaused=on;G.hold=false;A.apply();if(on){if(G.mode==='run')setUserPause(true);markDirty();flushSave()}}
P.onPause(()=>sysPause(true));P.onResume(()=>sysPause(false));
P.onAudio(()=>A.apply());
document.addEventListener('visibilitychange',()=>{if(document.hidden){sysPause(true)}else if(!P.inYT){sysPause(false)}});

// ================= main loop =================
let last=performance.now(),firstDone=false,uiT=0,fpsAcc=0,fpsN=0;
function frame(ts){
 requestAnimationFrame(frame);
 let dt=Math.min(0.05,(ts-last)/1000);last=ts;
 if((G.sysPaused&&firstDone)||G.cover)return;
 fpsAcc+=dt;fpsN++;if(fpsAcc>3){const avg=fpsAcc/fpsN;if(avg>1/50&&G.mode==='run'){if(DPR_CAP>1&&DPR>1){DPR_CAP=Math.max(1,Math.min(DPR_CAP,DPR)-0.25);resize()}else G.lite=true}fpsAcc=0;fpsN=0}
 const frozen=G.userPaused||G.adOn||G.sysPaused||G.mode==='revive'||G.mode==='results'||G.mode==='boot';
 if(!frozen&&R){const d=dt*G.ts;G.time+=d;stepRun(d)}else G.time+=dt*0.3;
 if(!frozen){for(const q of parts){q.life-=dt*G.ts;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.985}parts=parts.filter(q=>q.life>0);
  for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<f.life);G.flash=Math.max(0,G.flash-dt*2);updCamera(dt)}
 render();
 if(!firstDone){firstDone=true;P.firstFrame()}
 if(G.mode==='run')hud();
 if(tutTarget)tutPos();
 uiT-=dt;if(uiT<=0){uiT=0.5;if(G.mode==='menu'){festUI();giftBtn()}}
 A.music();
}

// ================= boot =================
async function boot(){
 resize();buildSprites();
 newRun(true,0);cam.x=R.x;cam.y=-400;
 requestAnimationFrame(frame);
 let raw='';try{raw=await P.load()}catch(e){}
 if(raw){try{const d=JSON.parse(raw);S=Object.assign(DEF(),d);S.upg=Object.assign({},d.upg||{});S.stats=Object.assign({runs:0,eaten:0},d.stats||{});if(!Array.isArray(S.slots)||S.slots.length!==3)S.slots=DEF().slots}catch(e){S=DEF()}}
 let lang=S.lang;
 if(!lang){const yl=String(await P.lang()).toLowerCase();lang=yl.startsWith('ar')?'ar':'en'}
 try{if(document.fonts&&document.fonts.load){await Promise.race([Promise.all([document.fonts.load('800 20px "Baloo Bhaijaan 2"'),document.fonts.load('800 20px "Baloo Bhaijaan 2"','تنين'),document.fonts.load('600 20px "Baloo Bhaijaan 2"','تنين')]),new Promise(r=>setTimeout(r,1500))])}}catch(e){}
 applyLang(lang);
 checkMissions();
 showMenu();
 P.ready();
}

// ---------- key art: a staged in-game scene rendered by the game's own renderer ----------
function stageCover(o){
 G.cover=true;G.noText=!o.text;applyLang(o.lang||'en');
 document.getElementById('ui').style.display='none';document.getElementById('tut').style.display='none';
 resize();DPR=1;cv.width=W;cv.height=H;
 const x0=ZONES[1].start*10+2600;
 const saveTut=S.tut;S.tut=2;newRun(false,1);S.tut=saveTut;R.tstep=-1;R.eaten=90;R.x=x0;R.zone=1;
 const port=H>W,sq=Math.abs(W-H)<50;cam.z=port?1.15:sq?1.25:1.35;G.time=2.2;G.shake=0;G.flash=0;
 const sc=BASE_SC*cam.z,VW=W/sc,VH=H/sc;
 cam.x=x0;cam.y=-VH*0.72+VH/2;
 const hx=x0+VW*(port?0.16:0.1),hy=-VH*(port?0.36:0.34);
 const P0={x:hx-VW*(port?0.55:0.42),y:320},P1={x:hx-VW*(port?0.5:0.4),y:-VH*0.2},P2={x:hx-VW*(port?0.3:0.22),y:hy+VH*0.16};
 const q=(u)=>{const a=1-u;return {x:a*a*a*P0.x+3*a*a*u*P1.x+3*a*u*u*P2.x+u*u*u*hx,y:a*a*a*P0.y+3*a*a*u*P1.y+3*a*u*u*P2.y+u*u*u*hy}};
 R.hist=[];for(let i=0;i<=600;i++){const u=1-i/600;const pt=q(u);R.hist.push({x:pt.x,y:pt.y})}
 R.x=hx;R.y=hy;const d=q(0.97);R.vx=(hx-d.x)*20;R.vy=(hy-d.y)*20;R.ang=Math.atan2(R.vy,R.vx);R.chomp=0.11;R.flame=R.maxF;R.fireT=0;
 items=[];parts=[];floats=[];
 const add=(ob)=>{ob.t=0;ob.ph=hash(items.length*3.1)*TAU;items.push(ob)};
 const step=VW*(port?0.13:0.075);
 for(let i=1;i<=5;i++){const u=i/5;add({type:'lan',x:hx+step*i,y:hy-VH*0.02-VH*0.16*Math.sin(u*Math.PI*0.8),r:26})}
 add({type:'gold',x:hx+step*(port?2.2:3),y:hy-VH*(port?0.2:0.26),r:30});
 add({type:'lan',x:hx-VW*(port?0.1:0.3),y:-VH*(port?0.52:0.58),r:26});
 for(let i=0;i<9;i++){const x=hx-VW*0.2+i*50;add({type:'pearl',x,y:surf(x)+130+Math.sin(i)*30,r:18})}
 if(o.text){const sx=cam.x-VW*(port?0.38:0.42);add({type:'sign',x:sx,y:surf(sx)+(port?60:30),z:1})}
 // fireworks burst frozen mid-bloom
 const fx=cam.x+VW*(port?0.25:0.3),fy=cam.y-VH*(port?0.1:0.12),cols=['#ff5a7a','#ffd166','#5ad1ff','#9dff7a'];
 for(let i=0;i<40;i++){const a=i/40*TAU,rr=rnd(110,170);parts.push({x:fx+Math.cos(a)*rr,y:fy+Math.sin(a)*rr,vx:0,vy:0,life:0.6,max:1,r:6,col:cols[i%4],kind:1,g:0})}
 // cloud splash where the body leaves the sea, sparks at the mouth
 const ex=q(0.12);for(let i=0;i<14;i++)parts.push({x:ex.x+rnd(-80,80),y:surf(ex.x)-rnd(0,70),vx:0,vy:0,life:0.7,max:1,r:rnd(14,30),col:'#fff',kind:2,g:0});
 for(let i=0;i<22;i++){const a=R.ang+rnd(-0.6,0.6),rr=rnd(40,150);parts.push({x:hx+Math.cos(a)*rr,y:hy+Math.sin(a)*rr,vx:0,vy:0,life:rnd(0.3,0.9),max:1,r:rnd(4,9),col:pick(['#ffd166','#ffb23f','#fff4c2']),kind:1,g:0})}
 palCache={key:''};farCache={};
 render();
 if(o.title){
  const tt=t('title'),fs=Math.round(Math.min(W*(port?0.14:0.085),H*0.13)*(LANG==='ar'?1.1:1));
  ctx.setTransform(1,0,0,1,0,0);ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction=RTL?'rtl':'ltr';
  ctx.font='800 '+fs+'px "Baloo Bhaijaan 2",sans-serif';
  {const m=ctx.measureText(tt).width;if(m>W*0.88){const f2=fs*W*0.88/m;ctx.font='800 '+f2+'px "Baloo Bhaijaan 2",sans-serif'}}
  const tx=W/2,ty=H*(port?0.13:0.15);
  ctx.lineJoin='round';ctx.fillStyle='rgba(20,10,31,0.5)';ctx.strokeStyle='rgba(20,10,31,0.5)';ctx.lineWidth=fs*0.22;ctx.strokeText(tt,tx,ty+fs*0.1);
  ctx.strokeStyle='#140a1f';ctx.lineWidth=fs*0.2;ctx.strokeText(tt,tx,ty);
  const g=ctx.createLinearGradient(0,ty-fs*0.5,0,ty+fs*0.5);g.addColorStop(0,'#fff6c4');g.addColorStop(0.55,'#ffd166');g.addColorStop(1,'#ff9f2e');ctx.fillStyle=g;ctx.fillText(tt,tx,ty);
 }
 return true;
}

window.__cd={G,get S(){return S},set S(v){S=v},get R(){return R},items:()=>items,startGame,showMenu,endRun,stats,stepRun:(dt)=>stepRun(dt),render,cam,newRun,buy:(id)=>{const u=UPG.find(q=>q.id===id);const l=lv(id),c=upgCost(u,l);if(l<u.max&&c<=S.pearls&&S.bestZone>=u.req){S.pearls-=c;S.upg[id]=l+1;mev('buy',1);return true}return false},UPG,ZONES,upgCost,missionAt,checkMissions,doRebirth,rebGain,applyLang,openSheet,closeSheet,resize,spawnItem:addItem,setBot:(b)=>{G.bot=b},stageCover,mev,CFG,audioGain:()=>A.master?A.master.gain.value:1,tick:(dt)=>{stepRun(dt);parts.length=0;floats.length=0;updCamera(dt)}};
boot();
